services:
  postgres:
    image: postgres:17.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: leadflow_migrator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_APP_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_APP_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - leadflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  n8n:
    image: n8nio/n8n:2.28.6
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:${N8N_PORT:-5680}/
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY is required}
      LEADFLOW_WEBHOOK_KEY: ${LEADFLOW_WEBHOOK_KEY:?LEADFLOW_WEBHOOK_KEY is required}
      RECOVERY_CONTEXT_KEY: ${RECOVERY_CONTEXT_KEY:?RECOVERY_CONTEXT_KEY is required}
      CRM_ADAPTER_URL: http://adapters:8080
      ENRICHMENT_ADAPTER_URL: http://adapters:8080
      ALERT_ADAPTER_URL: http://adapters:8080
      ADAPTER_CALL_TIMEOUT_MS: ${ADAPTER_CALL_TIMEOUT_MS:-30000}
      GENERIC_TIMEZONE: America/Santiago
      TZ: America/Santiago
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: none
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 24
    ports:
      - "127.0.0.1:${N8N_PORT:-5680}:5678"
    volumes:
      - leadflow_n8n_data:/home/node/.n8n
      - ./workflows:/opt/leadflow/workflows:ro
      - ./.local/n8n:/opt/leadflow/local:ro
    depends_on:
      postgres:
        condition: service_healthy
      crm-mock:
        condition: service_healthy
      enrichment-mock:
        condition: service_healthy
      slack-mock:
        condition: service_healthy
      adapters:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5678/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  crm-mock:
    build:
      context: ./mocks
      dockerfile: Dockerfile
    image: leadflow-mock:python-3.14.3
    restart: unless-stopped
    environment:
      MOCK_KIND: crm
      MOCK_PORT: 8080
    ports:
      - "127.0.0.1:${CRM_MOCK_PORT:-5683}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s

  enrichment-mock:
    build:
      context: ./mocks
      dockerfile: Dockerfile
    image: leadflow-mock:python-3.14.3
    restart: unless-stopped
    environment:
      MOCK_KIND: enrichment
      MOCK_PORT: 8080
      ENRICHMENT_INDUSTRY: ${ENRICHMENT_INDUSTRY:-software}
      ENRICHMENT_COMPANY_SIZE: ${ENRICHMENT_COMPANY_SIZE:-small}
      ENRICHMENT_WEBSITE: ${ENRICHMENT_WEBSITE:-https://example.test}
    ports:
      - "127.0.0.1:${ENRICHMENT_MOCK_PORT:-5682}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s

  slack-mock:
    build:
      context: ./mocks
      dockerfile: Dockerfile
    image: leadflow-mock:python-3.14.3
    restart: unless-stopped
    environment:
      MOCK_KIND: slack
      MOCK_PORT: 8080
    ports:
      - "127.0.0.1:${SLACK_MOCK_PORT:-5684}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s

  adapters:
    build:
      context: ./adapters
      dockerfile: Dockerfile
    image: leadflow-adapters:python-3.14.3
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      CRM_PROVIDER: ${CRM_PROVIDER:-mock}
      ENRICHMENT_PROVIDER: ${ENRICHMENT_PROVIDER:-mock}
      ADAPTER_PORT: 8080
      CRM_UPSTREAM_URL: ${CRM_BASE_URL_N8N:-http://crm-mock:8080}
      ENRICHMENT_UPSTREAM_URL: ${ENRICHMENT_BASE_URL_N8N:-http://enrichment-mock:8080}
      ALERT_UPSTREAM_URL: ${SLACK_WEBHOOK_URL:-http://slack-mock:8080/webhook}
      CRM_API_KEY: ${CRM_API_KEY:-}
      ENRICHMENT_API_KEY: ${ENRICHMENT_API_KEY:-}
      RETRY_MAX_ATTEMPTS: ${RETRY_MAX_ATTEMPTS:-3}
      RETRY_DELAY_FIRST_SECONDS: ${RETRY_DELAY_FIRST_SECONDS:-5}
      RETRY_DELAY_SECOND_SECONDS: ${RETRY_DELAY_SECOND_SECONDS:-15}
      ADAPTER_HTTP_TIMEOUT_MS: ${ADAPTER_HTTP_TIMEOUT_MS:-2000}
      CRM_CAP_CONSISTENT_LOOKUP_AFTER_CREATE: ${CRM_CAP_CONSISTENT_LOOKUP_AFTER_CREATE:-true}
      CRM_CAP_UNIQUE_EMAIL: ${CRM_CAP_UNIQUE_EMAIL:-true}
      CRM_CAP_IDEMPOTENT_CREATE_OPERATION_KEY: ${CRM_CAP_IDEMPOTENT_CREATE_OPERATION_KEY:-true}
      CRM_CAP_CONFLICT_RECONCILIATION: ${CRM_CAP_CONFLICT_RECONCILIATION:-true}
    ports:
      - "127.0.0.1:${ADAPTER_PORT:-5685}:8080"
    depends_on:
      crm-mock:
        condition: service_healthy
      enrichment-mock:
        condition: service_healthy
      slack-mock:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s

volumes:
  leadflow_postgres_data:
  leadflow_n8n_data:
