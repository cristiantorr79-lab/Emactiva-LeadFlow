services:
  web-bridge:
    build:
      context: ./bridge
      dockerfile: Dockerfile
    image: leadflow-web-bridge:python-3.14.3
    profiles: [web-bridge]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      WEB_BRIDGE_ENV: ${WEB_BRIDGE_ENV:-production}
      WEB_BRIDGE_BIND_HOST: 0.0.0.0
      WEB_BRIDGE_BIND_PORT: 8080
      WEB_BRIDGE_PUBLIC_PATH: ${WEB_BRIDGE_PUBLIC_PATH:?WEB_BRIDGE_PUBLIC_PATH is required}
      WEB_BRIDGE_UPSTREAM_URL: ${WEB_BRIDGE_UPSTREAM_URL:?WEB_BRIDGE_UPSTREAM_URL is required}
      WEB_BRIDGE_SOURCE: ${WEB_BRIDGE_SOURCE:?WEB_BRIDGE_SOURCE is required}
      WEB_BRIDGE_EVENT_ID_KEY: ${WEB_BRIDGE_EVENT_ID_KEY:?WEB_BRIDGE_EVENT_ID_KEY is required}
      WEB_BRIDGE_ALLOWED_ORIGINS: ${WEB_BRIDGE_ALLOWED_ORIGINS:?WEB_BRIDGE_ALLOWED_ORIGINS is required}
      WEB_BRIDGE_ABUSE_CONTROL: ${WEB_BRIDGE_ABUSE_CONTROL:?WEB_BRIDGE_ABUSE_CONTROL is required}
      WEB_BRIDGE_ABUSE_TOKEN: ${WEB_BRIDGE_ABUSE_TOKEN:?WEB_BRIDGE_ABUSE_TOKEN is required}
      WEB_BRIDGE_MAX_BODY_BYTES: ${WEB_BRIDGE_MAX_BODY_BYTES:-16384}
      WEB_BRIDGE_REQUEST_TIMEOUT_SECONDS: ${WEB_BRIDGE_REQUEST_TIMEOUT_SECONDS:-5}
      WEB_BRIDGE_UPSTREAM_TIMEOUT_SECONDS: ${WEB_BRIDGE_UPSTREAM_TIMEOUT_SECONDS:-10}
      WEB_BRIDGE_TURNSTILE_MODE: ${WEB_BRIDGE_TURNSTILE_MODE:?WEB_BRIDGE_TURNSTILE_MODE is required}
      WEB_BRIDGE_TURNSTILE_SECRET_KEY: ${WEB_BRIDGE_TURNSTILE_SECRET_KEY:?WEB_BRIDGE_TURNSTILE_SECRET_KEY is required}
      WEB_BRIDGE_TURNSTILE_HOSTNAMES: ${WEB_BRIDGE_TURNSTILE_HOSTNAMES:?WEB_BRIDGE_TURNSTILE_HOSTNAMES is required}
      WEB_BRIDGE_TURNSTILE_ACTION: ${WEB_BRIDGE_TURNSTILE_ACTION:-}
      WEB_BRIDGE_TURNSTILE_TIMEOUT_SECONDS: ${WEB_BRIDGE_TURNSTILE_TIMEOUT_SECONDS:-5}
      WEB_BRIDGE_TURNSTILE_PROXY_URL: ${WEB_BRIDGE_TURNSTILE_PROXY_URL:-}
      LEADFLOW_WEBHOOK_KEY: ${LEADFLOW_WEBHOOK_KEY:?LEADFLOW_WEBHOOK_KEY is required}
      LEADFLOW_ALLOWED_SOURCES: ${LEADFLOW_ALLOWED_SOURCES:?LEADFLOW_ALLOWED_SOURCES is required}
      LEADFLOW_ALLOWED_INTERESTS: ${LEADFLOW_ALLOWED_INTERESTS:?LEADFLOW_ALLOWED_INTERESTS is required}
    expose:
      - "8080"
    networks:
      - upstream

networks:
  upstream:
    external: true
    name: ${WEB_BRIDGE_UPSTREAM_NETWORK:?WEB_BRIDGE_UPSTREAM_NETWORK is required}
